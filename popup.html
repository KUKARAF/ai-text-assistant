<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      padding: 16px;
      margin: 0;
      color: #1a1a1a;
    }

    h1 {
      font-size: 15px;
      margin: 0 0 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      box-sizing: border-box;
    }

    textarea {
      height: 80px;
      resize: vertical;
    }

    .field {
      margin-bottom: 12px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-row input[type="range"] {
      flex: 1;
    }

    .slider-value {
      min-width: 28px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    button {
      width: 100%;
      padding: 8px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    #status {
      text-align: center;
      margin-top: 8px;
      color: #16a34a;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>AI Text Assistant</h1>

  <div class="field">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="sk-or-...">
  </div>

  <div class="field">
    <label for="model">Model</label>
    <input type="text" id="model" placeholder="anthropic/claude-3.5-haiku">
  </div>

  <div class="field">
    <label for="prompt">System Prompt</label>
    <textarea id="prompt"></textarea>
  </div>

  <div class="field">
    <label for="temperature">Temperature</label>
    <div class="slider-row">
      <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7">
      <span class="slider-value" id="tempValue">0.7</span>
    </div>
  </div>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
