name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create extension zip
        run: zip -r ai-text-assistant.zip manifest.json background.js content.js popup.html popup.js icons/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-text-assistant.zip
          generate_release_notes: true
